<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background: #ffffff; border-radius: 8px; padding: 40px; }
        .title { font-size: 22px; font-weight: bold; color: #333333; }
        .message { font-size: 15px; color: #555555; margin-top: 16px; line-height: 1.6; }
        .button { display: inline-block; margin-top: 28px; padding: 14px 28px; background-color: #4F46E5; color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 15px; }
        .footer { margin-top: 40px; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="title">Activate Your Account</div>
    <div class="message">
        You have been invited to the School Management System.<br/>
        Click the button below to activate your account and set your password.<br/>
        This link expires in <strong>24 hours</strong>.
    </div>
    <a href="{{ACTIVATION_LINK}}" class="button">Activate Account</a>
    <div class="footer">
        If you did not expect this email, you can safely ignore it.
    </div>
</div>
</body>
</html>
